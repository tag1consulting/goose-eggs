# The theme-test-data demo site. Bring it up with ./setup.sh start, which also installs
# and configures WordPress through the `cli` service.
name: goose-eggs-theme-test-data

x-database: &database
  WORDPRESS_DB_HOST: db
  WORDPRESS_DB_USER: wordpress
  WORDPRESS_DB_PASSWORD: wordpress
  WORDPRESS_DB_NAME: wordpress

services:
  db:
    image: mariadb:11.4.13
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress
      MARIADB_ROOT_PASSWORD: root
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      timeout: 5s
      retries: 60

  wordpress:
    image: wordpress:7.1.3-php8.3-apache
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${PORT:-18081}:80"
    environment: *database
    volumes:
      - wordpress:/var/www/html
    healthcheck:
      test: ["CMD", "test", "-f", "/var/www/html/wp-config.php"]
      interval: 2s
      timeout: 5s
      retries: 60

  # wp-cli, sharing the WordPress files; only run by setup.sh.
  cli:
    image: wordpress:cli-2.12.0-php8.3
    profiles: [cli]
    user: "33:33"
    depends_on:
      wordpress:
        condition: service_healthy
    environment:
      <<: *database
      WP_CLI_CACHE_DIR: /tmp/wp-cli-cache
    volumes:
      - wordpress:/var/www/html

volumes:
  db:
  wordpress:
