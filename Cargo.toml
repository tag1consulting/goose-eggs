[package]
name = "goose-eggs"
version = "0.7.1-dev"
authors = ["Jeremy Andrews <jeremy@tag1.com>"]
edition = "2018"
description = "Helpful in writing Goose load tests."
homepage = "https://goose.rs"
documentation = "https://docs.rs/goose-eggs"
repository = "https://github.com/tag1consulting/goose-eggs"
readme = "README.md"
keywords = ["loadtesting", "performance", "web"]
license = "Apache-2.0"

[dependencies]
goose = { version = "0.19", default-features = false }
html-escape = "0.2"
http = "1.1"
log = "0.4"
rand = "0.9"
regex = "1.5"
serde_json = "1"
tokio = { version = "1", features = [ "macros" ] }

[features]
default = ["goose/default"]
rustls-tls = ["goose/rustls-tls"]

[dev-dependencies]
httpmock = "0.7"

# Needs a live WordPress site; see the file for how to run it.
[[test]]
name = "wordpress_site"
path = "tests/sites/wordpress.rs"
