[package]
name = "goose-eggs"
version = "0.7.0-dev"
authors = ["Jeremy Andrews <jeremy@tag1.com>"]
edition = "2018"
description = "Helpful in writing Goose load tests."
homepage = "https://goose.rs"
documentation = "https://docs.rs/goose-eggs"
repository = "https://github.com/tag1consulting/goose-eggs"
readme = "README.md"
keywords = ["loadtesting", "performance", "web"]
license = "Apache-2.0"

[dependencies]
# Goose `main` (0.19.0-dev). At release this becomes `version = "0.19"`, see RELEASING.md.
goose = { git = "https://github.com/tag1consulting/goose", rev = "0f69e2374242b204db59a84e09903dba9a971ff6", default-features = false }
html-escape = "0.2"
http = "1.1"
log = "0.4"
rand = "0.9"
regex = "1.5"
serde_json = "1"
tokio = { version = "1", features = [ "macros" ] }

[features]
default = ["goose/default"]
rustls-tls = ["goose/rustls-tls"]

[dev-dependencies]
httpmock = "0.7"
